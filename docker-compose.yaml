version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html 
      - ./var/log:/var/www/html/var/log 
      - ./var/cache:/var/www/html/var/cache
      - ./var/sessions:/var/www/html/var/sessions
    depends_on:
      - db
    environment:
      DATABASE_URL: "pgsql://app:password@db:5432/app"
      APP_ENV: dev 
      APP_SECRET: f9cd09a294d659b23b978f03211cbe68
      PHP_IDE_CONFIG: serverName=Docker
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data 
    ports:
      - "5433:5432"
    networks:
      - app-network

  webserver:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      - app
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  db_data: