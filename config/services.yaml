# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    jwt_secret: "%env(JWT_SECRET)%"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\JwtTokenManager:
        arguments:
            $secretKey: "%jwt_secret%"

    App\EventListener\TokenListener:
        tags:
            - {
                name: kernel.event_listener,
                event: kernel.controller,
                method: onKernelController,
            }

    kreait_firebase.factory:
        class: Kreait\Firebase\Factory
        arguments:
            - '%env(FIREBASE_CREDENTIALS)%'
            - {
                projectId: '%env(FIREBASE_PROJECT_ID)%'
            }

    Kreait\Firebase\Database:
        factory: ['@kreait_firebase.factory', 'createDatabase']

    Kreait\Firebase\Auth:
        factory: ['@kreait_firebase.factory', 'createAuth']

    Kreait\Firebase\Contract\Firestore:
        factory: ['@kreait_firebase.factory', 'createFirestore']

    Kreait\Firebase\Storage:
        factory: ['@kreait_firebase.factory', 'createStorage']

    App\Service\FirebaseUserSyncService:
        arguments:
            $firestore: '@Kreait\Firebase\Contract\Firestore'
            $em: '@doctrine.orm.entity_manager'

    App\EventSubscriber\UserSyncSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    App\Command\SyncUsersCommand:
        tags: [ console.command ]


    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
